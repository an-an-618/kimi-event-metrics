<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kimi · 事件触发主流程演示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#202020;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1100px;margin:auto;padding:39px 25px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:45px}.brand{font-size:26px;font-weight:700;letter-spacing:-1px}a{text-decoration:none;color:inherit}.enter{font-size:12px;background:#202020;color:white;padding:11px 15px;border-radius:8px}h1{font-size:28px;font-weight:550;letter-spacing:-.7px;margin:0 0 12px}p{font-size:13px;color:#888;line-height:1.9}video{display:block;width:100%;aspect-ratio:8/5;background:#202020;border:1px solid #e5e5e5;border-radius:14px;margin:27px 0 17px}.caption{display:flex;justify-content:space-between;gap:18px;font-size:11px;color:#999;line-height:1.8}.caption a{text-decoration:underline;text-underline-offset:4px;white-space:nowrap}button{font:inherit;font-size:11px;color:#777;background:white;border:1px solid #ddd;border-radius:7px;padding:8px 12px;margin-top:14px;cursor:pointer}footer{font-size:11px;color:#aaa;line-height:1.9;border-top:1px solid #e5e5e5;margin-top:33px;padding-top:23px}footer a{text-decoration:underline;text-underline-offset:3px}:focus-visible{outline:2px solid #777;outline-offset:4px}@media(max-width:600px){main{padding:25px 16px}header{margin-bottom:35px}.brand{font-size:23px}.enter{font-size:11px;padding:10px 12px}h1{font-size:23px}p{font-size:12px}.caption{flex-direction:column;gap:8px}}
</style></head><body><main><header><a href="/" class="brand">KIMI</a><a href="/" class="enter">进入可交互原型 ↗</a></header><h1>持续关注，变化时回应</h1><p>一次自然语言委托，如何变成真正由后台触发的主动分析？<br>这段录屏展示完整主流程，事件通过 HTTP 进入服务端，没有调用真实模型。</p><video controls playsinline preload="metadata" aria-label="约 113 秒事件触发主流程录屏"><source src="/demo/main-flow.mp4" type="video/mp4"></video><button id="play" type="button">播放录屏</button><div class="caption"><span>委托 → 正常保持安静 → 切换会话 → HTTP 异常事件 → 主动告警 → 查看证据 → 重复无骚扰 → 恢复</span><a href="/demo/main-flow.mp4" download>下载 MP4</a></div><footer>合成业务数据；规则与语言部分为演示，触发、计算及状态真实运行。<br>录屏来自实际本地前后端。没有调用真实 Kimi 模型、发送外部邮件或修改生产业务。<br><a href="https://github.com/an-an-618/kimi-event-metrics">查看 GitHub 源码与验证记录</a></footer></main><script>
const video=document.querySelector('video'),button=document.querySelector('#play');
button.addEventListener('click',async()=>{if(video.paused){try{await video.play()}catch{button.textContent='请使用播放器或下载 MP4'}}else video.pause()});
video.addEventListener('play',()=>button.textContent='暂停录屏');
video.addEventListener('pause',()=>button.textContent=video.ended?'重新播放':'播放录屏');
</script></body></html>
