name: Independent DNS and HTTPS check
on:
  workflow_dispatch:
    inputs:
      url:
        description: HTTPS site to diagnose
        required: true
        default: https://kimi-event-metrics.vercel.app
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Resolve domain and read HTTPS page and backend
        env:
          CHECK_URL: ${{ inputs.url }}
          ACCESS_OUTPUT: access-results
        run: python3 scripts/check-access.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-access-evidence
          path: access-results
